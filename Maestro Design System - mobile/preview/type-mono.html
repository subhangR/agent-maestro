<!DOCTYPE html>
<!-- @dsCard group="Type" name="Eyebrow, Quote & Mono" subtitle="The signature mono eyebrow, the serif-italic agent quote, terminal type" viewport="700x270" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; }
  body { background: var(--pn-surface); padding: 24px 26px; color: var(--pn-ink); }
  .block { padding: 13px 0; border-bottom: 1px solid var(--pn-line); }
  .block:last-child { border-bottom: none; }
  .lbl { font-family: var(--pn-mono); font-size: 9.5px; color: var(--pn-ink-4); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .term { background: #1c1a16; border-radius: var(--pn-r-sm); padding: 12px 14px; font-family: var(--pn-mono); font-size: 12.5px; line-height: 1.7; }
  .term .p { color: #d99a4e; } .term .d { color: #8a8474; } .term .ok { color: #7bb98e; }
</style>
</head>
<body>
  <div class="block"><div class="lbl">Eyebrow · 11 / 600 / 0.12em</div><span class="t-eyebrow">Active sessions · 4 running</span></div>
  <div class="block"><div class="lbl">Quote · Newsreader italic — agent "now playing"</div><span class="t-quote">Reparenting the terminal node, then I'll re-run the fit.</span></div>
  <div class="block"><div class="lbl">Mono · terminal</div>
    <div class="term"><div><span class="p">&gt;</span> spawn --worker claude <span class="d">--task auth</span></div><div><span class="ok">✓</span> session fluffy-starlight started</div></div>
  </div>
</body>
</html>
