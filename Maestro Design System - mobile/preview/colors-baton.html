<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brass Accent" subtitle="The one restrained warm signature — the conductor's baton, daylit" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; }
  body { background: var(--pn-surface); font-family: var(--pn-ui); padding: 24px 26px; color: var(--pn-ink-2); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { height: 90px; border-radius: var(--pn-r-sm); display: flex; flex-direction: column; justify-content: flex-end; padding: 9px 10px; border: 1px solid var(--pn-line); }
  .name { font-family: var(--pn-mono); font-size: 11px; font-weight: 700; }
  .hex { font-family: var(--pn-mono); font-size: 10px; opacity: 0.85; }
  .cap { display: block; margin-top: 14px; color: var(--pn-brand); }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw" style="background:#B26A2B;"><span class="name" style="color:#FBF6EE;">brand ★</span><span class="hex" style="color:#FBF6EE;">#B26A2B</span></div>
    <div class="sw" style="background:#9A581F;"><span class="name" style="color:#FBF6EE;">brand-2</span><span class="hex" style="color:#FBF6EE;">#9A581F</span></div>
    <div class="sw" style="background:#E0A45A;"><span class="name" style="color:#2A1A08;">dark ★</span><span class="hex" style="color:#2A1A08;">#E0A45A</span></div>
    <div class="sw" style="background:rgba(178,106,43,0.11); border-color:rgba(178,106,43,0.32);"><span class="name" style="color:#B26A2B;">soft</span><span class="hex" style="color:#B26A2B;">11%</span></div>
  </div>
  <span class="cap t-eyebrow">★ primary in each theme · the only warm-saturated color · used sparingly</span>
</body>
</html>
