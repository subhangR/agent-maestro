<!DOCTYPE html>
<!-- @dsCard group="Type" name="Font Families" subtitle="Newsreader (editorial) · Hanken Grotesk (UI) · JetBrains Mono (data)" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; }
  body { background: var(--pn-surface); padding: 24px 26px; color: var(--pn-ink); }
  .fam { padding: 14px 0; border-bottom: 1px solid var(--pn-line); }
  .fam:last-child { border-bottom: none; }
  .meta { font-family: var(--pn-mono); font-size: 10px; color: var(--pn-ink-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .spec-serif { font-family: var(--pn-serif); font-size: 26px; font-weight: 500; }
  .spec-ui { font-family: var(--pn-ui); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .spec-mono { font-family: var(--pn-mono); font-size: 20px; font-weight: 500; }
</style>
</head>
<body>
  <div class="fam"><div class="meta">Newsreader · serif · display & quotes</div><div class="spec-serif">Conduct your agents in concert</div></div>
  <div class="fam"><div class="meta">Hanken Grotesk · UI · headings & body</div><div class="spec-ui">Run them all at once</div></div>
  <div class="fam"><div class="meta">JetBrains Mono · data · eyebrows & terminal</div><div class="spec-mono">&gt; spawn --worker claude</div></div>
</body>
</html>
