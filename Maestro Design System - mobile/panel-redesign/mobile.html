<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maestro — Mobile</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="tiles.css" />
<link rel="stylesheet" href="mobile.css" />
<link rel="stylesheet" href="theme-dark.css" />
<style>
  html, body { margin: 0; height: 100%; background: #2A251C; }
  #root { height: 100vh; }
  .mb-stage .mb-phone { transform-origin: center; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="kit.jsx"></script>
<script type="text/babel" src="tiles.jsx"></script>
<script type="text/babel" src="icons-team-1.jsx"></script>
<script type="text/babel" src="icons-team-2.jsx"></script>
<script type="text/babel" src="mobile-tasks.jsx"></script>
<script type="text/babel" src="mobile-sessions.jsx"></script>
<script type="text/babel" src="mobile-team.jsx"></script>
<script type="text/babel" src="mobile.jsx"></script>
<script>
  (function () {
    function fit() {
      var ph = document.querySelector('.mb-phone');
      if (!ph) return;
      var s = Math.min(1, (window.innerHeight - 16) / 852);
      ph.style.transformOrigin = 'top center';
      ph.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) { new ResizeObserver(fit).observe(document.documentElement); }
    setInterval(fit, 500);
    fit();
  })();
</script>
</body>
</html>
