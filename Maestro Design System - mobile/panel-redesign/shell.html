<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maestro — App Shell (redesigned)</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="tiles.css" />
<link rel="stylesheet" href="terminal-strip.css" />
<link rel="stylesheet" href="theme-dark.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--pn-paper); }
  /* responsive desktop app shell — fills the viewport; scrolls if narrower than min */
  #stage { position: fixed; inset: 0; overflow: auto; }
  #frame { min-width: 1120px; width: 100%; height: 100vh; overflow: hidden; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="root"></div></div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="kit.jsx"></script>
<script type="text/babel" src="tiles.jsx"></script>
<script type="text/babel" src="terminal-strip.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
</body>
</html>
