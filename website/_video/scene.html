<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro — explainer render source</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Schibsted+Grotesk:wght@400;500;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0c0a09; height: 100%; }
  body { display: grid; place-items: center; min-height: 100vh; }
  #stage { width: 1280px; height: 720px; max-width: 100vw; max-height: 56.25vw; display: block; background: #161014; }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>
(function () {
  "use strict";

  /* ============================================================
     Maestro explainer — deterministic render source.
     Every visible pixel is a pure function of t (seconds).
     ============================================================ */

  var W = 1280, H = 720, FPS = 30;
  var SS = 2; /* internal supersample */

  var INTRO = 3.0;
  var BEAT = 2.6;
  var NBEATS = 9;
  var FINALE = 5.0;
  var BEATS_START = INTRO;
  var FIN_START = INTRO + NBEATS * BEAT;      /* 26.4 */
  var DURATION = FIN_START + FINALE;          /* 31.4 */

  var TAU = Math.PI * 2;

  /* ---- palette (mirrors the live site tokens) ---- */
  var GROUND = "#161014";
  var INK = "#f0e9dd";
  var VOICES = [
    { c: "#e3a55a", f: 1.02, f2: 2.10, ph: 0.0, amp: 0.95 },  /* v1 Claude */
    { c: "#84c4b1", f: 1.20, f2: 1.70, ph: 1.7, amp: 0.86 },  /* v2 Codex */
    { c: "#93aae7", f: 0.78, f2: 2.60, ph: 3.1, amp: 0.92 },  /* v3 Gemini */
    { c: "#da8aa0", f: 1.38, f2: 1.35, ph: 4.6, amp: 0.80 }   /* v4 Hermes */
  ];
  function ink(a) { return "rgba(240,233,221," + a + ")"; }

  var F_DISPLAY = "Fraunces";
  var F_BODY = "\"Schibsted Grotesk\"";
  var F_MONO = "\"Fragment Mono\"";

  /* ---- copy (verbatim) ---- */
  var BEATS = [
    { title: "Durable terminals",        line: "Server-owned terminals that restore exactly where they stopped.",  visual: "shot",  img: "home" },
    { title: "Provider-native resume",   line: "Claude and Codex sessions resume on their own identifiers.",       visual: "motifResume" },
    { title: "Task graph and hierarchy", line: "Break outcomes into a graph you actually work in.",                visual: "shot",  img: "graph" },
    { title: "Persistent teammates",     line: "Reusable agent personas with models, skills, and permissions.",    visual: "shot",  img: "team" },
    { title: "Cross-model hand-offs",    line: "Claude plans, Codex builds, Gemini reviews; the context carries.", visual: "motifHandoff" },
    { title: "Transcript-backed activity", line: "A plain-language feed, read straight from the transcript.",      visual: "shot",  img: "feed" },
    { title: "Local-first storage",      line: "Everything as inspectable JSON under ~/.maestro/.",                visual: "shot",  img: "docs" },
    { title: "Spells and skills",        line: "Portable context and automation across the whole workspace.",      visual: "motifSpell" },
    { title: "Agent-operable CLI",       line: "Agents run maestro themselves; one shared control plane.",         visual: "shot",  img: "tasks" }
  ];
  var KICKER = "LOCAL-FIRST AGENT ORCHESTRATION";
  var FIN_TITLE = "Introducing Maestro.";
  var FIN_LINE = "One command center for your coding agents.";

  /* ---- easing / math helpers (all pure) ---- */
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function lerp(a, b, x) { return a + (b - a) * x; }
  function ss(a, b, x) { /* smoothstep */
    var u = clamp01((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  }
  function eoc(x) { x = clamp01(x); return 1 - Math.pow(1 - x, 3); }
  function eoq(x) { x = clamp01(x); return 1 - Math.pow(1 - x, 4); }
  function bell(x, c, w) { var d = (x - c) / w; return Math.exp(-d * d); }

  /* ---- canvases ---- */
  var stage = document.getElementById("stage");
  var stageCtx = stage.getContext("2d");
  var off = document.createElement("canvas");
  off.width = W * SS; off.height = H * SS;
  var ctx = off.getContext("2d");

  /* ---- assets ---- */
  var IMG_SRCS = {
    home:  "../assets/shots/home.jpg",
    tasks: "../assets/shots/tasks.jpg",
    graph: "../assets/shots/graph.jpg",
    team:  "../assets/shots/team.jpg",
    docs:  "../assets/shots/docs.jpg",
    feed:  "../assets/shots/feed.jpg",
    ring:  "../assets/brand/mark-ring-white.png",
    eight: "../assets/brand/mark-eight.png"
  };
  var IMGS = {};
  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var im = new Image();
      im.onload = function () {
        if (im.decode) { im.decode().then(function () { resolve(im); }, function () { resolve(im); }); }
        else resolve(im);
      };
      im.onerror = function () { reject(new Error("image failed: " + src)); };
      im.src = src;
    });
  }

  var FONT_SPECS = [
    "600 46px " + F_DISPLAY,
    "600 62px " + F_DISPLAY,
    "400 20px " + F_BODY,
    "500 21px " + F_BODY,
    "400 13px " + F_MONO,
    "400 11px " + F_MONO
  ];
  function fontsSettled() {
    function attempt(n) {
      return Promise.all(FONT_SPECS.map(function (s) { return document.fonts.load(s); })).then(function () {
        var ok = FONT_SPECS.every(function (s) { return document.fonts.check(s); });
        if (ok || n <= 0) return;
        return new Promise(function (r) { setTimeout(r, 120); }).then(function () { return attempt(n - 1); });
      });
    }
    return attempt(50).then(function () { return document.fonts.ready; });
  }

  var ready = Promise.all([
    fontsSettled(),
    Promise.all(Object.keys(IMG_SRCS).map(function (k) {
      return loadImage(IMG_SRCS[k]).then(function (im) { IMGS[k] = im; });
    }))
  ]).then(function () {
    /* warm-up pass: the very first raster of an image at a new scale can
       differ by a few pixels from every later one (filter caches), so
       render one frame of each visual once before declaring ready */
    var warm = [1.5, 4.5, 7.1, 9.7, 12.3, 14.9, 17.5, 20.1, 22.7, 25.3, 28.2, 31.0];
    for (var i = 0; i < warm.length; i++) renderAt(warm[i]);
    renderAt(0);
  });

  /* ---- shared drawing helpers ---- */
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawTracked(c, text, cx, y, spacing, font, fill) {
    c.font = font;
    c.fillStyle = fill;
    var widths = [], total = 0;
    for (var i = 0; i < text.length; i++) {
      var w = c.measureText(text[i]).width;
      widths.push(w);
      total += w + (i < text.length - 1 ? spacing : 0);
    }
    var x = cx - total / 2;
    for (var j = 0; j < text.length; j++) {
      c.fillText(text[j], x, y);
      x += widths[j] + spacing;
    }
    return total;
  }

  function wrapText(c, text, font, maxW) {
    c.font = font;
    var words = text.split(" ");
    var lines = [], cur = "";
    for (var i = 0; i < words.length; i++) {
      var probe = cur ? cur + " " + words[i] : words[i];
      if (c.measureText(probe).width > maxW && cur) {
        lines.push(cur);
        cur = words[i];
      } else cur = probe;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  /* ============================================================
     THE SCORE — the site's signature sum-of-sines voice lines.
     ============================================================ */
  var SIGMA = 0.075;
  function voiceBase(i, conv, cy) {
    var b = H * (0.47 + i * 0.115);
    return lerp(b, cy, conv);
  }
  function edgeTaper(u) { return Math.min(1, u * 5.5, (1 - u) * 5.5); }
  function voiceY(u, tt, i, g, bx, conv, cy) {
    var v = VOICES[i];
    var du = u - bx;
    var align = Math.exp(-(du * du) / (2 * SIGMA * SIGMA));
    var personal = Math.sin(u * TAU * v.f * 1.55 + tt * 1.05 + v.ph) * 0.62
                 + Math.sin(u * TAU * v.f2 + tt * 0.72 + v.ph * 2.3) * 0.38;
    var chord = Math.sin(u * 7.5 - tt * 1.15 + 0.4);
    var base = voiceBase(i, conv, cy);
    var mean = (voiceBase(0, conv, cy) + voiceBase(3, conv, cy)) / 2;
    var b = base + (mean - base) * align * 0.22;
    var A = H * 0.058 * v.amp * g * edgeTaper(u) * 1.075 * (1 - 0.82 * conv);
    /* as the finale converges, every voice folds into the same chord */
    var mix = lerp(align * 0.8, 1, conv);
    return b + A * (personal * (1 - mix) + chord * mix * 0.62);
  }

  function drawScore(t, o) {
    /* o: { g, bx, alpha, conv, cy, baton } — all derived from t upstream */
    var g = o.g, bx = o.bx, conv = o.conv, cy = o.cy;
    if (o.alpha <= 0.003) return;
    ctx.save();
    ctx.globalAlpha = o.alpha;

    /* faint stave rules */
    ctx.strokeStyle = ink(0.05 * (1 - conv));
    ctx.lineWidth = 1;
    for (var i = 0; i < 4; i++) {
      var by = voiceBase(i, conv, cy);
      ctx.beginPath(); ctx.moveTo(0, by); ctx.lineTo(W, by); ctx.stroke();
    }

    /* baton band + baton */
    if (o.baton > 0.003) {
      var px = bx * W;
      var top = voiceBase(0, conv, cy) - H * 0.1;
      var bot = voiceBase(3, conv, cy) + H * 0.1;
      var grad = ctx.createLinearGradient(px - 80, 0, px + 80, 0);
      grad.addColorStop(0, "rgba(240,233,221,0)");
      grad.addColorStop(0.5, ink(0.05 * o.baton));
      grad.addColorStop(1, "rgba(240,233,221,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(px - 80, top, 160, bot - top);
      ctx.strokeStyle = ink(0.10 * o.baton);
      ctx.beginPath();
      ctx.moveTo(px, voiceBase(0, conv, cy) - H * 0.08);
      ctx.lineTo(px, voiceBase(3, conv, cy) + H * 0.08);
      ctx.stroke();
    }

    /* voices: bright strand + soft echo strand each */
    var step = W / 120;
    for (var vi = 0; vi < 4; vi++) {
      for (var s = 0; s < 2; s++) {
        ctx.beginPath();
        ctx.strokeStyle = VOICES[vi].c;
        ctx.globalAlpha = o.alpha * (s ? 0.28 : 0.85);
        ctx.lineWidth = s ? 1 : 1.6;
        var first = true;
        for (var x = 0; x <= W + step; x += step) {
          var u = Math.min(1, x / W);
          var y = voiceY(u, t + s * 0.35, vi, g * (s ? 0.7 : 1), bx, conv, cy);
          if (first) { ctx.moveTo(x, y); first = false; }
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      /* node where the baton meets the voice */
      if (o.baton > 0.003) {
        var ny = voiceY(bx, t, vi, g, bx, conv, cy);
        ctx.globalAlpha = o.alpha * 0.95 * o.baton;
        ctx.fillStyle = VOICES[vi].c;
        ctx.beginPath(); ctx.arc(bx * W, ny, 2.6, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }

  /* deterministic "struck notes": phase-scheduled, derived only from t */
  function drawNotes(t, alpha, bx, g, conv, cy) {
    if (alpha <= 0.003 || g < 0.6 || conv > 0.15) return;
    var TEMPO = 0.75, LIFE = 1.5;
    ctx.save();
    for (var beat = Math.floor((t - LIFE) * TEMPO); beat <= Math.floor(t * TEMPO); beat++) {
      if (beat < 2) continue;
      var born = beat / TEMPO;
      var age = (t - born) / LIFE;
      if (age < 0 || age >= 1) continue;
      /* baton position at strike time (same closed form as bx(t)) */
      var sbx = 0.5 + 0.34 * Math.sin(born * 0.33);
      for (var k = 0; k < 2; k++) {
        var vi = (beat * 2 + k) % 4;
        var y0 = voiceY(sbx, born, vi, 1, sbx, 0, cy);
        ctx.globalAlpha = alpha * (1 - age) * 0.85;
        ctx.fillStyle = VOICES[vi].c;
        ctx.beginPath();
        ctx.arc(sbx * W, y0 - age * 16, 2.1 + age * 1.2, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /* ============================================================
     Framed screenshot card
     ============================================================ */
  var CARD = { x: 560, y: 164, w: 660, h: 392, r: 14, bar: 34 };

  function drawWindowFrame(alpha, lift) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(0, lift);
    ctx.shadowColor = "rgba(0,0,0,0.55)";
    ctx.shadowBlur = 46;
    ctx.shadowOffsetY = 18;
    ctx.fillStyle = "#1d1620";
    rr(ctx, CARD.x, CARD.y, CARD.w, CARD.h, CARD.r);
    ctx.fill();
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.restore();
  }

  function drawShotCard(imgKey, alpha, lift) {
    drawWindowFrame(alpha, lift);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(0, lift);

    /* title bar dots */
    ctx.fillStyle = ink(0.22);
    for (var d = 0; d < 3; d++) {
      ctx.beginPath();
      ctx.arc(CARD.x + 20 + d * 16, CARD.y + CARD.bar / 2, 4, 0, TAU);
      ctx.fill();
    }

    /* screenshot, cover-cropped, top-anchored */
    var cx = CARD.x, cy = CARD.y + CARD.bar;
    var cw = CARD.w, ch = CARD.h - CARD.bar;
    var im = IMGS[imgKey];
    var scale = Math.max(cw / im.naturalWidth, ch / im.naturalHeight);
    var sw = cw / scale, sh = ch / scale;
    var sx = (im.naturalWidth - sw) / 2;
    var sy = Math.min((im.naturalHeight - sh) * 0.12, im.naturalHeight - sh);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + cw, cy);
    ctx.lineTo(cx + cw, cy + ch - CARD.r);
    ctx.arcTo(cx + cw, cy + ch, cx + cw - CARD.r, cy + ch, CARD.r);
    ctx.lineTo(cx + CARD.r, cy + ch);
    ctx.arcTo(cx, cy + ch, cx, cy + ch - CARD.r, CARD.r);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(im, sx, sy, sw, sh, cx, cy, cw, ch);
    ctx.restore();

    /* frame line */
    ctx.strokeStyle = ink(0.16);
    ctx.lineWidth = 1;
    rr(ctx, CARD.x + 0.5, CARD.y + 0.5, CARD.w - 1, CARD.h - 1, CARD.r);
    ctx.stroke();
    ctx.restore();
  }

  /* ============================================================
     Generative voice-motif panels
     ============================================================ */
  function motifPanelBegin(alpha, lift) {
    drawWindowFrame(alpha, lift);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(0, lift);
    ctx.fillStyle = "rgba(240,233,221,0.03)";
    rr(ctx, CARD.x, CARD.y, CARD.w, CARD.h, CARD.r);
    ctx.fill();
    ctx.strokeStyle = ink(0.16);
    ctx.lineWidth = 1;
    rr(ctx, CARD.x + 0.5, CARD.y + 0.5, CARD.w - 1, CARD.h - 1, CARD.r);
    ctx.stroke();
    rr(ctx, CARD.x, CARD.y, CARD.w, CARD.h, CARD.r);
    ctx.clip();
    /* faint stave rules inside the panel */
    ctx.strokeStyle = ink(0.05);
    for (var i = 1; i < 4; i++) {
      var y = CARD.y + CARD.h * (i / 4);
      ctx.beginPath(); ctx.moveTo(CARD.x, y); ctx.lineTo(CARD.x + CARD.w, y); ctx.stroke();
    }
  }
  function motifPanelEnd() { ctx.restore(); }

  function panelStrandY(u, tt, yBase, ampPx, f1, f2, ph) {
    var taper = Math.min(1, u * 6, (1 - u) * 6);
    return yBase + ampPx * taper * (
      Math.sin(u * TAU * f1 + tt * 1.05 + ph) * 0.62 +
      Math.sin(u * TAU * f2 + tt * 0.72 + ph * 2.3) * 0.38
    );
  }

  function strokeStrand(color, width, alpha, fn, u0, u1, dashed) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.globalAlpha *= alpha;
    if (dashed) ctx.setLineDash([2, 7]);
    ctx.beginPath();
    var steps = 70;
    var first = true;
    for (var s = 0; s <= steps; s++) {
      var u = u0 + (u1 - u0) * (s / steps);
      var p = fn(u);
      if (first) { ctx.moveTo(p[0], p[1]); first = false; }
      else ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke();
    ctx.restore();
  }

  /* Beat 2 — provider-native resume: a strand pauses into dots, then
     picks up again at its own identifier. */
  function motifResume(local, alpha, lift, tGlobal) {
    motifPanelBegin(alpha, lift);
    var rows = [
      { v: 0, yF: 0.36, gapA: 0.40, gapB: 0.56, id: "01J9K2F7", ph: 0.4, f1: 1.35, f2: 2.2 },
      { v: 1, yF: 0.66, gapA: 0.48, gapB: 0.64, id: "8fd2c4a1", ph: 2.1, f1: 1.6, f2: 1.9 }
    ];
    var draw = eoq((local - 0.25) / 1.5); /* strands sweep in left to right */
    for (var r = 0; r < rows.length; r++) {
      (function (row) {
        var yB = CARD.y + CARD.h * row.yF;
        var fn = function (u) {
          return [CARD.x + 26 + u * (CARD.w - 52),
                  panelStrandY(u, tGlobal, yB, 20, row.f1, row.f2, row.ph)];
        };
        var c = VOICES[row.v].c;
        var end = draw;
        /* solid before the gap */
        strokeStrand(c, 1.7, 0.9, fn, 0, Math.min(end, row.gapA), false);
        /* dotted through the pause */
        if (end > row.gapA) strokeStrand(c, 1.4, 0.5, fn, row.gapA, Math.min(end, row.gapB), true);
        /* solid, brighter, after the resume */
        if (end > row.gapB) strokeStrand(c, 2.1, 1.0, fn, row.gapB, end, false);
        /* resume node + soft pulse ring */
        if (end > row.gapB) {
          var p = fn(row.gapB);
          var k = ss(row.gapB, row.gapB + 0.08, end);
          ctx.save();
          ctx.fillStyle = c;
          ctx.globalAlpha *= k;
          ctx.beginPath(); ctx.arc(p[0], p[1], 3.4, 0, TAU); ctx.fill();
          ctx.strokeStyle = c;
          ctx.lineWidth = 1;
          ctx.globalAlpha *= 0.5 * (0.6 + 0.4 * Math.sin(tGlobal * 2.4 + row.ph));
          ctx.beginPath(); ctx.arc(p[0], p[1], 9 + 2.5 * Math.sin(tGlobal * 1.7 + row.ph), 0, TAU); ctx.stroke();
          ctx.restore();
          /* the identifier it resumed on */
          ctx.save();
          ctx.globalAlpha *= k * 0.9;
          ctx.font = "400 11px " + F_MONO;
          ctx.fillStyle = c;
          ctx.fillText(row.id, p[0] - 26, p[1] + 26);
          ctx.restore();
        }
      })(rows[r]);
    }
    motifPanelEnd();
  }

  /* Beat 5 — cross-model hand-offs: three voices converge into one
     carried line; a context pulse travels the whole way through. */
  function motifHandoff(local, alpha, lift, tGlobal) {
    motifPanelBegin(alpha, lift);
    var x0 = CARD.x + 26, x1 = CARD.x + CARD.w - 26;
    var join = 0.58; /* u where the voices meet */
    var yMid = CARD.y + CARD.h * 0.5;
    var starts = [0.26, 0.5, 0.74];
    var draw = eoq((local - 0.25) / 1.5);
    var fns = [];
    for (var i = 0; i < 3; i++) {
      (function (idx) {
        var yA = CARD.y + CARD.h * starts[idx];
        var fn = function (u) {
          var m = ss(join - 0.22, join, u);           /* pull toward the joined line */
          var yBase = lerp(yA, yMid, m);
          var amp = lerp(16, 7, m);
          return [x0 + u * (x1 - x0),
                  panelStrandY(u, tGlobal, yBase, amp, 1.2 + idx * 0.25, 2.0 - idx * 0.2, idx * 1.9)];
        };
        fns.push(fn);
        strokeStrand(VOICES[idx].c, 1.7, idx === 2 ? 0.95 : 0.85, fn, 0, draw, false);
      })(i);
    }
    /* the join node */
    if (draw > join) {
      var jp = fns[1](join);
      ctx.save();
      ctx.globalAlpha *= ss(join, join + 0.06, draw);
      ctx.fillStyle = ink(0.9);
      ctx.beginPath(); ctx.arc(jp[0], jp[1], 3.6, 0, TAU); ctx.fill();
      ctx.strokeStyle = ink(0.35);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(jp[0], jp[1], 10 + 2 * Math.sin(tGlobal * 1.9), 0, TAU); ctx.stroke();
      ctx.restore();
    }
    /* the context pulse: rides voice 1, hands to 2, then 3 */
    var pu = clamp01((local - 0.5) / 1.7) * 0.98;
    if (pu > 0.01 && pu < draw) {
      var seg = pu < 0.33 ? 0 : pu < join ? 1 : 2;
      var pp = fns[seg](pu);
      var pc = VOICES[seg].c;
      ctx.save();
      var glow = ctx.createRadialGradient(pp[0], pp[1], 0, pp[0], pp[1], 16);
      glow.addColorStop(0, pc);
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha *= 0.5;
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(pp[0], pp[1], 16, 0, TAU); ctx.fill();
      ctx.globalAlpha *= 2;
      ctx.fillStyle = pc;
      ctx.beginPath(); ctx.arc(pp[0], pp[1], 4, 0, TAU); ctx.fill();
      ctx.restore();
    }
    motifPanelEnd();
  }

  /* Beat 8 — spells and skills: a carried ring glides along the score
     and the voices align inside it wherever it goes. */
  function motifSpell(local, alpha, lift, tGlobal) {
    motifPanelBegin(alpha, lift);
    var x0 = CARD.x + 26, x1 = CARD.x + CARD.w - 26;
    var draw = eoq((local - 0.2) / 1.2);
    var ru = lerp(0.2, 0.8, eoc(clamp01((local - 0.35) / 1.9)));  /* ring travel */
    var rx = x0 + ru * (x1 - x0);
    var rSig = 0.1;
    var fns = [];
    for (var i = 0; i < 4; i++) {
      (function (idx) {
        var yB = CARD.y + CARD.h * (0.26 + idx * 0.16);
        var yMid = CARD.y + CARD.h * 0.5;
        var fn = function (u) {
          var du = u - ru;
          var al = Math.exp(-(du * du) / (2 * rSig * rSig));
          var yBase = lerp(yB, lerp(yB, yMid, 0.55), al);
          var amp = lerp(15, 4, al);
          return [x0 + u * (x1 - x0),
                  panelStrandY(u, tGlobal, yBase, amp, 1.1 + idx * 0.2, 1.9 + idx * 0.15, idx * 1.6)];
        };
        fns.push(fn);
        strokeStrand(VOICES[idx].c, 1.6, 0.85, fn, 0, draw, false);
      })(i);
    }
    /* the ring, plus a fainter trailing echo */
    if (local > 0.35) {
      var ringA = ss(0.35, 0.7, local);
      var ry = CARD.y + CARD.h * 0.5;
      ctx.save();
      ctx.globalAlpha *= ringA;
      ctx.strokeStyle = ink(0.65);
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(rx, ry, 58, 0, TAU); ctx.stroke();
      ctx.strokeStyle = ink(0.2);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(rx - 34, ry, 58, 0, TAU); ctx.stroke();
      /* sparks where the voices cross the ring */
      for (var s = 0; s < 4; s++) {
        var p = fns[s](ru);
        ctx.fillStyle = VOICES[s].c;
        ctx.globalAlpha = alpha * ringA * (0.7 + 0.3 * Math.sin(tGlobal * 2.2 + s * 1.7));
        ctx.beginPath(); ctx.arc(p[0], p[1], 2.8, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
    motifPanelEnd();
  }

  /* ============================================================
     Beat text column
     ============================================================ */
  function drawBeatText(idx, local, alpha) {
    var b = BEATS[idx];
    var vc = VOICES[idx % 4].c;
    var LX = 84, MAXW = 400;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textBaseline = "alphabetic";

    /* soft scrim so type reads over the score */
    var scr = ctx.createRadialGradient(270, 330, 40, 270, 330, 330);
    scr.addColorStop(0, "rgba(22,16,20,0.72)");
    scr.addColorStop(1, "rgba(22,16,20,0)");
    ctx.fillStyle = scr;
    ctx.fillRect(0, 60, 560, 560);

    /* index marker */
    ctx.font = "400 13px " + F_MONO;
    ctx.fillStyle = vc;
    var idxA = ss(0.05, 0.3, local);
    ctx.globalAlpha = alpha * idxA;
    var marker = "0" + (idx + 1) + " / 09";
    var mx = LX;
    for (var i = 0; i < marker.length; i++) {
      ctx.fillText(marker[i], mx, 228);
      mx += ctx.measureText(marker[i]).width + 2.5;
    }
    ctx.globalAlpha = alpha * idxA * 0.5;
    ctx.strokeStyle = vc;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(LX, 240.5);
    ctx.lineTo(LX + 60 * idxA, 240.5);
    ctx.stroke();

    /* title — wipes in left to right */
    var titleFont = "600 46px " + F_DISPLAY;
    var tLines = wrapText(ctx, b.title, titleFont, MAXW + 20);
    var wipe = eoq((local - 0.15) / 0.65);
    var ty = 300;
    ctx.font = titleFont;
    ctx.fillStyle = INK;
    for (var li = 0; li < tLines.length; li++) {
      var lw = ctx.measureText(tLines[li]).width;
      var lineWipe = clamp01(wipe * (tLines.length === 1 ? 1 : 1.25) - li * 0.25);
      if (lineWipe > 0) {
        ctx.save();
        ctx.globalAlpha = alpha * Math.min(1, lineWipe * 2);
        ctx.beginPath();
        ctx.rect(LX - 4, ty - 46 + li * 54, (lw + 10) * eoq(lineWipe), 58);
        ctx.clip();
        ctx.fillText(tLines[li], LX, ty + li * 54);
        ctx.restore();
      }
    }
    var afterTitleY = ty + (tLines.length - 1) * 54 + 44;

    /* one-liner — types in */
    var bodyFont = "400 20px " + F_BODY;
    var bLines = wrapText(ctx, b.line, bodyFont, MAXW);
    var totalChars = b.line.length;
    var typed = Math.floor(totalChars * clamp01((local - 0.55) / 1.0));
    ctx.font = bodyFont;
    ctx.fillStyle = ink(0.82);
    ctx.globalAlpha = alpha;
    var remaining = typed;
    var caretX = LX, caretY = afterTitleY;
    for (var bi = 0; bi < bLines.length; bi++) {
      var lineText = bLines[bi];
      var take = Math.max(0, Math.min(lineText.length, remaining));
      var shown = lineText.slice(0, take);
      var yy = afterTitleY + bi * 30;
      if (take > 0) ctx.fillText(shown, LX, yy);
      if (take < lineText.length || bi === bLines.length - 1) {
        caretX = LX + ctx.measureText(shown).width;
        caretY = yy;
      }
      remaining -= lineText.length + 1; /* the wrapped space */
      if (remaining < 0) break;
    }
    /* caret: solid while typing, blinks briefly after, then rests */
    var typing = typed < totalChars && local > 0.55;
    var done = typed >= totalChars;
    var caretA = 0;
    if (typing) caretA = 1;
    else if (done) caretA = (1 - ss(1.9, 2.25, local)) * (Math.sin(local * TAU * 1.6) > -0.2 ? 1 : 0);
    if (local > 0.5 && caretA > 0) {
      ctx.globalAlpha = alpha * caretA * 0.9;
      ctx.fillStyle = vc;
      ctx.fillRect(caretX + 3, caretY - 16, 9, 20);
    }
    ctx.restore();
  }

  /* ============================================================
     Intro
     ============================================================ */
  function drawIntro(t) {
    var a = ss(0.85, 1.5, t) * (1 - ss(2.35, 2.95, t));
    if (a <= 0.003) return;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textBaseline = "alphabetic";
    var y = 258;
    var w = drawTracked(ctx, KICKER, W / 2, y, 4, "400 13px " + F_MONO, ink(0.7));
    ctx.strokeStyle = ink(0.22);
    ctx.lineWidth = 1;
    var half = w / 2 + 26;
    ctx.beginPath();
    ctx.moveTo(W / 2 - half - 60 * a, y - 4.5); ctx.lineTo(W / 2 - half, y - 4.5);
    ctx.moveTo(W / 2 + half, y - 4.5); ctx.lineTo(W / 2 + half + 60 * a, y - 4.5);
    ctx.stroke();
    ctx.restore();
  }

  /* ============================================================
     Finale
     ============================================================ */
  function drawFinale(f) {
    /* chord bloom at the moment the voices resolve */
    var chordGlow = bell(f, 1.7, 0.45);
    if (chordGlow > 0.01) {
      ctx.save();
      var g = ctx.createRadialGradient(W / 2, 360, 0, W / 2, 360, 240);
      g.addColorStop(0, ink(0.14 * chordGlow));
      g.addColorStop(1, "rgba(240,233,221,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    /* the loop mark draws in */
    var mp = ss(1.6, 3.0, f);           /* ring sweep */
    var ea = ss(2.35, 3.15, f);         /* eight fades up inside */
    var mcx = W / 2, mcy = 262, msz = 176;
    if (mp > 0.003) {
      ctx.save();
      var settle = ss(1.6, 3.2, f);
      var sc = lerp(0.92, 1, settle);
      ctx.translate(mcx, mcy);
      ctx.scale(sc, sc);
      ctx.translate(-mcx, -mcy);
      if (mp < 0.999) {
        ctx.beginPath();
        ctx.moveTo(mcx, mcy);
        ctx.arc(mcx, mcy, msz, -Math.PI / 2, -Math.PI / 2 + TAU * mp);
        ctx.closePath();
        ctx.clip();
      }
      ctx.globalAlpha = Math.min(1, mp * 3);
      ctx.drawImage(IMGS.ring, mcx - msz / 2, mcy - msz / 2, msz, msz);
      ctx.restore();
      if (ea > 0.003) {
        ctx.save();
        ctx.globalAlpha = ea;
        ctx.drawImage(IMGS.eight, mcx - msz / 2, mcy - msz / 2, msz, msz);
        ctx.restore();
      }
      /* four faint voice ticks around the ring, settling into place */
      var tickA = ss(2.6, 3.5, f) * 0.8;
      if (tickA > 0.003) {
        ctx.save();
        for (var i = 0; i < 4; i++) {
          var ang = -Math.PI / 2 + i * (TAU / 4);
          var r1 = msz * 0.62, r2 = msz * 0.62 + 9;
          ctx.strokeStyle = VOICES[i].c;
          ctx.globalAlpha = tickA;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(mcx + Math.cos(ang) * r1, mcy + Math.sin(ang) * r1);
          ctx.lineTo(mcx + Math.cos(ang) * r2, mcy + Math.sin(ang) * r2);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    /* wordmark */
    var ta = ss(2.9, 3.7, f);
    if (ta > 0.003) {
      ctx.save();
      ctx.globalAlpha = ta;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.font = "600 62px " + F_DISPLAY;
      ctx.fillStyle = INK;
      ctx.fillText(FIN_TITLE, W / 2, 468 + (1 - ta) * 14);
      ctx.restore();
    }
    var la = ss(3.25, 4.0, f);
    if (la > 0.003) {
      ctx.save();
      ctx.globalAlpha = la * 0.8;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.font = "500 21px " + F_BODY;
      ctx.fillStyle = ink(0.8);
      ctx.fillText(FIN_LINE, W / 2, 514 + (1 - la) * 10);
      ctx.restore();
    }
  }

  /* ============================================================
     renderAt — the whole frame, purely from t
     ============================================================ */
  function renderAt(t) {
    t = Math.max(0, Math.min(DURATION, t));
    ctx.setTransform(SS, 0, 0, SS, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.globalAlpha = 1;

    /* ground */
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var glow = ctx.createRadialGradient(W / 2, H * 0.42, 60, W / 2, H * 0.42, 900);
    glow.addColorStop(0, "rgba(240,233,221,0.028)");
    glow.addColorStop(1, "rgba(240,233,221,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    var f = t - FIN_START; /* finale local time (negative before) */

    /* score energy: tense flat line, then bloom (site's downbeat) */
    var g;
    if (t < 0.55) g = 0.08 + 0.015 * Math.sin(t * 24);
    else g = 0.08 + 0.92 * eoc((t - 0.55) / 1.25);

    /* baton drifts; in the finale it walks home to center */
    var bxFree = 0.5 + 0.34 * Math.sin(t * 0.33);
    var conv = 0, bx = bxFree, scoreAlpha, baton = 1, cy = 360;
    var inBeats = ss(INTRO - 0.5, INTRO + 0.3, t);
    scoreAlpha = lerp(1, 0.4, inBeats);
    if (f > 0) {
      conv = ss(0.1, 1.7, f);
      bx = lerp(bxFree, 0.5, ss(0.0, 1.2, f));
      scoreAlpha = lerp(0.4, 0.95, ss(0.0, 0.9, f)) * (1 - ss(1.9, 2.9, f));
      baton = 1 - ss(0.6, 1.4, f);
    }

    drawScore(t, { g: g, bx: bx, alpha: scoreAlpha, conv: conv, cy: cy, baton: baton });
    drawNotes(t, scoreAlpha * (f > 0 ? 1 - ss(0, 0.6, f) : 1) * (t < INTRO ? 1 : 0.5), bx, g, conv, cy);

    /* intro */
    if (t < INTRO + 0.2) drawIntro(t);

    /* feature beats */
    if (t >= BEATS_START - 0.2 && f < 0.6) {
      for (var i = 0; i < NBEATS; i++) {
        var start = BEATS_START + i * BEAT;
        var local = t - start;
        if (local < 0 || local >= BEAT + 0.05) continue;
        var ain = ss(0.0, 0.35, local);
        var aout = 1 - ss(BEAT - 0.3, BEAT, local);
        var a = ain * aout;
        if (f > 0) a *= 1 - ss(0, 0.4, f);
        if (a <= 0.003) continue;
        var lift = (1 - eoq(local / 0.55)) * 22;
        var b = BEATS[i];
        if (b.visual === "shot") drawShotCard(b.img, a, lift);
        else if (b.visual === "motifResume") motifResume(local, a, lift, t);
        else if (b.visual === "motifHandoff") motifHandoff(local, a, lift, t);
        else if (b.visual === "motifSpell") motifSpell(local, a, lift, t);
        drawBeatText(i, local, a);
      }
    }

    /* finale */
    if (f > 0) drawFinale(f);

    /* vignette */
    var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.44, W / 2, H / 2, H * 1.02);
    vg.addColorStop(0, "rgba(12,9,8,0)");
    vg.addColorStop(1, "rgba(12,9,8,0.4)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    /* present: downscale the 2x buffer onto the 1280x720 stage */
    stageCtx.clearRect(0, 0, W, H);
    stageCtx.drawImage(off, 0, 0, W, H);
  }

  /* ---- contract ---- */
  window.SCENE = {
    w: W, h: H, fps: FPS, duration: DURATION,
    ready: ready,
    renderAt: renderAt
  };

  /* ---- preview loop (wall clock feeds renderAt only; renderAt reads
     nothing from it — pure function of its argument) ---- */
  ready.then(function () {
    renderAt(0);
    var previewStart = null;
    function loop(now) {
      if (window.SCENE.preview === false) return; // external pause for frame-accurate capture
      if (previewStart === null) previewStart = now;
      var t = ((now - previewStart) / 1000) % DURATION;
      renderAt(t);
      window.requestAnimationFrame(loop);
    }
    window.requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
