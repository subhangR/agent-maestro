name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Server test gate — must pass before any build job runs.
  #
  # Coverage: 67 tests across 8 suites, measured at ~3s wall clock.
  #   harness-* / loop-*      H1 task auto-advance, H2 deactivateSpell locking,
  #                           H3 exit reaping, H4 reconciliation, loop counters
  #   token-analytics         TokenAnalyticsService + /api/analytics/tokens/*
  #   quota-enforcement       provider quota policy and spawn-time enforcement
  #   task-graph-service      cycle detection, getReadyNodes, topo determinism
  #   model-profiles          profile CRUD + quota persistence
  #
  # These are the suites covering everything added in the token-analytics,
  # quota, and loop/graph/harness work. They are pure application-layer tests
  # over tmp-dir file repos, so they are cheap enough to gate every release on.
  #
  # NOT covered by this gate: the full Jest suite (25+ min), UI/Vitest tests
  # (687 tests, ~70s — worth adding as a parallel job), or CLI/integration
  # tests. Those must be run locally or in a dedicated slow-test workflow.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck server
        working-directory: maestro-server
        run: bunx tsc --noEmit

      - name: Run server test gate
        working-directory: maestro-server
        run: |
          bun run jest --testPathPattern="harness-|loop-|token-analytics|quota-enforcement|task-graph-service|model-profiles" --forceExit
        # --forceExit prevents Jest from hanging after tests complete
        # (open async handles from file-based repos in tmp dirs)

  # ---------------------------------------------------------------------------
  # Job 1: Build server + CLI binaries for all 4 platforms
  # ---------------------------------------------------------------------------
  build-binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            rust-target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: win-x64
            rust-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      # -- Server binary --
      - name: Build server
        working-directory: maestro-server
        run: |
          bun run build
          bun run build:binary:${{ matrix.target }}

      # -- CLI binary --
      - name: Build CLI
        working-directory: maestro-cli
        run: |
          bun run build
          bun run build:binary:${{ matrix.target }}

      # -- Package (Unix) --
      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp maestro-server/dist/bin/maestro-server staging/
          cp maestro-cli/dist/bin/maestro staging/
          chmod +x staging/*
          tar -czf maestro-${{ matrix.target }}.tar.gz -C staging .

      # -- Package (Windows) --
      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item maestro-server/dist/bin/maestro-server.exe staging/
          Copy-Item maestro-cli/dist/bin/maestro.exe staging/
          Compress-Archive -Path staging/* -DestinationPath maestro-${{ matrix.target }}.zip

      # -- Upload archive artifact --
      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: maestro-${{ matrix.target }}.*

      # -- Upload raw server binary for Tauri sidecar --
      - name: Upload server binary for Tauri (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: server-binary-${{ matrix.target }}
          path: maestro-server/dist/bin/maestro-server

      - name: Upload server binary for Tauri (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: server-binary-${{ matrix.target }}
          path: maestro-server/dist/bin/maestro-server.exe

  # ---------------------------------------------------------------------------
  # Job 2: Build Tauri desktop app for each platform
  # ---------------------------------------------------------------------------
  build-tauri:
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            rust-target: aarch64-apple-darwin
            sidecar-name: maestro-server-aarch64-apple-darwin
            bundles: app
            desktop-ext: tar.gz
          - os: ubuntu-latest
            target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            sidecar-name: maestro-server-x86_64-unknown-linux-gnu
            bundles: appimage
            desktop-ext: AppImage
          - os: windows-latest
            target: win-x64
            rust-target: x86_64-pc-windows-msvc
            sidecar-name: maestro-server-x86_64-pc-windows-msvc.exe
            bundles: nsis
            desktop-ext: exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: maestro-ui/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: bun install

      # -- Download the server binary built in the previous job --
      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-binary-${{ matrix.target }}
          path: maestro-ui/src-tauri/binaries

      # -- Rename sidecar to Rust target triple --
      - name: Rename sidecar binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv maestro-ui/src-tauri/binaries/maestro-server \
             maestro-ui/src-tauri/binaries/${{ matrix.sidecar-name }}
          chmod +x maestro-ui/src-tauri/binaries/${{ matrix.sidecar-name }}

      - name: Rename sidecar binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item `
            maestro-ui/src-tauri/binaries/maestro-server.exe `
            maestro-ui/src-tauri/binaries/${{ matrix.sidecar-name }}

      # -- Build the CLI bundle that tauri.conf.prod.json bundles as a resource
      #    (../../maestro-cli/dist/bundle.cjs). Without this the Tauri build
      #    fails: "resource path ../../maestro-cli/dist/bundle.cjs doesn't exist". --
      - name: Build CLI bundle (Tauri resource)
        working-directory: maestro-cli
        # bundle (esbuild) reads dist/index.js, so tsc must run first — matches
        # the build-binaries "Build CLI" step. In a clean CI checkout dist/ is
        # empty, so `bun run bundle` alone fails: Could not resolve "dist/index.js".
        run: |
          bun run build
          bun run bundle

      # -- Build the Tauri app --
      - name: Build Tauri app
        working-directory: maestro-ui
        env:
          VITE_API_URL: http://localhost:2357/api
          VITE_WS_URL: ws://localhost:2357
          # The frontend (beforeBuildCommand → vite build) is large (Monaco,
          # xterm, excalidraw); raise the Node heap so vite build doesn't OOM.
          NODE_OPTIONS: --max-old-space-size=4096
        run: bunx tauri build --features custom-protocol --config src-tauri/tauri.conf.prod.json --bundles ${{ matrix.bundles }}

      # -- Package desktop artifact (macOS) --
      - name: Package desktop app (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_DIR=$(find maestro-ui/src-tauri/target/release/bundle -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: .app bundle not found"
            find maestro-ui/src-tauri/target/release/bundle -type d
            exit 1
          fi
          # Rename "Maestro Prod.app" -> "Agent Maestro.app"
          APP_PARENT=$(dirname "$APP_DIR")
          mv "$APP_DIR" "$APP_PARENT/Agent Maestro.app"
          tar -czf maestro-desktop-${{ matrix.target }}.tar.gz -C "$APP_PARENT" "Agent Maestro.app"

      # -- Package desktop artifact (Linux) --
      - name: Package desktop app (Linux)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(find maestro-ui/src-tauri/target/release/bundle -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: AppImage not found"
            find maestro-ui/src-tauri/target/release/bundle -type f
            exit 1
          fi
          cp "$APPIMAGE" maestro-desktop-${{ matrix.target }}.AppImage

      # -- Package desktop artifact (Windows) --
      - name: Package desktop app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path maestro-ui/src-tauri/target/release/bundle -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            Write-Error "NSIS installer not found"
            Get-ChildItem -Path maestro-ui/src-tauri/target/release/bundle -Recurse
            exit 1
          }
          Copy-Item $installer.FullName "maestro-desktop-${{ matrix.target }}.exe"

      # -- Upload desktop artifact --
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: maestro-desktop-${{ matrix.target }}.*

  # ---------------------------------------------------------------------------
  # Job 3: Create GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  release:
    needs: [build-binaries, build-tauri]
    if: always() && needs.build-binaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -- Download all artifacts --
      - name: Download all binary archives
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: release-assets
          merge-multiple: true

      - name: Download all desktop artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      # -- Generate checksums --
      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      # -- Create GitHub Release --
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
