name: Deploy marketing website

on:
  pull_request:
    paths:
      - "website/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate website package
        run: node scripts/validate-website.mjs

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAESTRO_5F3FC }}"
          projectId: maestro-5f3fc
          expires: 7d

  deploy-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAESTRO_5F3FC }}"
          projectId: maestro-5f3fc
          channelId: live
